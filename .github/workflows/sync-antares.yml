name: Sync with Antares

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Antares as upstream remote
        run: |
          git remote add upstream https://github.com/ShowingCloud/Antares.git || true
          git remote set-url upstream https://github.com/ShowingCloud/Antares.git

      - name: Fetch from upstream
        run: git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout -b sync-antares-$(date +%s) || git checkout -b sync-antares-$(date +%s)
          git merge upstream/main --no-edit || {
            echo "Merge conflicts detected. Creating PR for manual review."
            exit 0
          }

      - name: Push changes
        run: |
          git push origin HEAD:main || {
            echo "No changes to push or push failed."
            exit 0
          }

      - name: Create PR if conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Sync with Antares - Manual Review Required"
          body: |
            This PR contains changes from the Antares repository that require manual review due to merge conflicts.
            
            Please review and resolve conflicts before merging.
          branch: sync-antares-conflicts
          delete-branch: true

